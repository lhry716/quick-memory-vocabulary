<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17171a" />
    <title>記住 2027｜單字練習</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="styles-final.css?v=20260909-tab-centre" />
  </head>
  <body>
    <div class="app-shell codex-shell">
      <section class="codex-workbench">
        <header class="codex-topbar">
          <div><span class="codex-topbar-label">快速記憶法</span><span class="codex-topbar-divider">/</span><span id="codex-topbar-state">總覽</span></div>
          <button class="codex-topbar-action" type="button" data-action="open-settings">資料管理</button>
        </header>
        <div class="codex-canvas">
          <main id="app" tabindex="-1"></main>
        </div>
      </section>
    </div>

    <div id="modal-root"></div>
    <input id="file-input" type="file" accept=".csv,.txt,text/csv,text/plain" hidden />
    <input id="restore-input" type="file" accept="application/json,.json" hidden />
    <script src="app.js?v=20260909-glass-refine"></script>
  </body>
</html>
